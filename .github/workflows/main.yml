- name: Extract project archive
  shell: bash
  run: |
    set -euo pipefail

    test -f OU-The-Builder-node24-foundation.zip || {
      echo "::error::OU-The-Builder-node24-foundation.zip was not found"
      exit 1
    }

    unzip -q OU-The-Builder-node24-foundation.zip -d extracted

    PROJECT_DIR="$(
      find extracted -type f -name package.json -print0 |
        while IFS= read -r -d '' pkg; do
          candidate="$(dirname "$pkg")"
          printf '%s\n' "$candidate"
          break
        done
    )"

    if [ -z "$PROJECT_DIR" ]; then
      echo "::error::No directory contains package.json"
      find extracted -maxdepth 6 -print
      exit 1
    fi

    echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
    echo "Using project directory: $PROJECT_DIR"
