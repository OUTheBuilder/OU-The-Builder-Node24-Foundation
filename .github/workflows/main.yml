name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Add the step that downloads or creates this archive before extraction.
      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail

          test -f OU-The-Builder-node24-foundation.zip || {
            echo "::error::OU-The-Builder-node24-foundation.zip was not found"
            exit 1
          }

          unzip -q OU-The-Builder-node24-foundation.zip -d extracted

          PROJECT_DIR="$(
            find extracted -type f -name package-lock.json -print0 |
              while IFS= read -r -d '' lockfile; do
                candidate="$(dirname "$lockfile")"
                if [ -f "$candidate/gradlew" ]; then
                  printf '%s\n' "$candidate"
                  break
                fi
              done
          )"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No directory contains both package-lock.json and gradlew"
            find extracted -maxdepth 6 -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"
